server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Allow mesh/texture uploads to ComfyUI (default nginx limit is 1MB).
    # 600k-tri GLBs with baked 4K/8K textures run 40-160MB+, so leave headroom.
    client_max_body_size 400M;

    # DNS for dynamic upstreams (docker embedded DNS + public fallback)
    resolver 127.0.0.11 1.1.1.1 valid=10s ipv6=off;

    # Deployment config — shared settings, stored OUTSIDE the html root
    # (served from /configdir so docker-compose can mount a named volume
    # on that directory; volumes can't mount single files). GET serves it;
    # PUT (WebDAV) lets any browser write settings back so every browser
    # sees the same config. Cross-site writes are blocked by the browser's
    # CORS preflight (no CORS headers are ever returned here). Never cached.
    location = /config.json {
        root /configdir;
        dav_methods PUT;
        client_max_body_size 1m;
        add_header Cache-Control "no-store";
    }

    # Frontend (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the hashed bundles — never cache it, otherwise a
    # refresh can resurrect a stale HTML pointing at an old bundle.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # content-hashed assets are immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- This app's own API (studio-api: shared hidden-ids, model ----
    # ---- resolution, LAN REST) — same-origin for every browser.     ----
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream studio-api:5557;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Long-lived generate flows (3D mesh 30min / skin 25min / mesh
        # upscale 45min) block the request until done — the default 300s
        # would 504 them mid-run. 60min = API's own timeoutSec ceiling.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 400M;
        add_header Cache-Control "no-store" always;
    }

    # ---- Dynamic reverse proxy (same-origin, avoids CORS errors) ----
    # Target backend comes from a URL saved in the web UI:
    #   /proxy/<host>/<port>/<path>?query            → http upstream
    #   /proxy/https/<host>/<port>/<path>?query      → https upstream (SearXNG, image downloads, ...)
    # e.g. /proxy/192.168.1.50/8188/system_stats
    # HTTPS must be listed FIRST so the literal "https" segment wins.

    location ~ ^/proxy/https/(?<shost>[^/]+)/(?<sport>[^/]+)/(?<srest>.*)$ {
        proxy_pass https://$shost:$sport/$srest$is_args$args;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $shost;
        # allow self-signed / internal-CA certs (e.g. *.local)
        proxy_ssl_verify off;
        proxy_set_header Host $shost:$sport;
        proxy_set_header X-Real-IP $remote_addr;
        # don't forward the app's origin — image hosts use Referer for
        # hotlink protection, and APIs (OpenAI/Anthropic) trust bare
        # server-side requests more than random browser origins
        proxy_set_header Referer "";
        proxy_set_header Origin "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # don't let upstream compressed data confuse binary image passthrough
        proxy_set_header Accept-Encoding "";
        # proxied files/results can change per request — never cache them
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/proxy/(?<chost>[^/]+)/(?<cport>[^/]+)/(?<crest>.*)$ {
        proxy_pass http://$chost:$cport/$crest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $chost:$cport;
        proxy_set_header Origin "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store" always;
    }
}
