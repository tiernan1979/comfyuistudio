server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Allow image uploads to ComfyUI (default nginx limit is 1MB)
    client_max_body_size 50M;

    # DNS for dynamic upstreams (docker embedded DNS + public fallback)
    resolver 127.0.0.11 1.1.1.1 valid=10s ipv6=off;

    # Deployment config — the compose file mounts the host's config.json
    # over this path; never cached so edits apply on the next page load
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # Frontend (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Dynamic reverse proxy (same-origin, avoids CORS errors) ----
    # Target backend comes from a URL saved in the web UI:
    #   /proxy/<host>/<port>/<path>?query            → http upstream
    #   /proxy/https/<host>/<port>/<path>?query      → https upstream (SearXNG, image downloads, ...)
    # e.g. /proxy/192.168.1.50/8188/system_stats
    # HTTPS must be listed FIRST so the literal "https" segment wins.

    location ~ ^/proxy/https/(?<shost>[^/]+)/(?<sport>[^/]+)/(?<srest>.*)$ {
        proxy_pass https://$shost:$sport/$srest$is_args$args;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $shost;
        # allow self-signed / internal-CA certs (e.g. *.local)
        proxy_ssl_verify off;
        proxy_set_header Host $shost:$sport;
        proxy_set_header X-Real-IP $remote_addr;
        # don't forward the app's origin — image hosts use Referer for
        # hotlink protection, and APIs (OpenAI/Anthropic) trust bare
        # server-side requests more than random browser origins
        proxy_set_header Referer "";
        proxy_set_header Origin "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # don't let upstream compressed data confuse binary image passthrough
        proxy_set_header Accept-Encoding "";
    }

    location ~ ^/proxy/(?<chost>[^/]+)/(?<cport>[^/]+)/(?<crest>.*)$ {
        proxy_pass http://$chost:$cport/$crest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $chost:$cport;
        proxy_set_header Origin "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
