services:
  comfyui-studio:
    # Prebuilt image published by GitHub Actions (.github/workflows/docker.yml),
    # or build locally with:  docker compose up -d --build
    image: ghcr.io/tiernan1979/comfyuistudio:latest
    build: .
    ports:
      - "5555:80"
    environment:
      - NODE_ENV=production
    extra_hosts:
      # Lets the container reach services on the Docker host by name,
      # e.g. LM Studio at http://host.docker.internal:1234
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      # Settings (config.json) — written by Settings → Save (WebDAV PUT),
      # read by every browser. Named volume keeps them across rebuilds and
      # image pulls; without this a `docker compose up -d --build` resets
      # every device back to defaults. (Mounted on the /configdir
      # directory — Docker volumes can't target a single file.)
      - studio-config:/configdir

  # Optional LAN REST API (generate image/edit/video/music, models, history,
  # shared hidden-ids for cross-device deletes). See api/src/server.js.
  studio-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "5557:5557"
    environment:
      - COMFYUI_URL=http://10.1.1.102:8188
      # Set to require Authorization: Bearer <key> on every /api route
      - API_KEY=
      - DATA_DIR=/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - studio-api-data:/app/data

volumes:
  studio-api-data:
  studio-config:
